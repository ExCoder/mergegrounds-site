version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 1.81.0 removed the react/react-compiler rule used by the strict profile.
      # Re-evaluate when upstream restores it or documents an equivalent rule.
      - dependency-name: oxlint
        versions:
          - 1.80.0
          - 1.81.0
      # The site builds and runs on Node 22; keep its type model on the same LTS.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # vinext is validated against TypeScript 5.x; upgrade only after an
      # explicit framework compatibility review, not an automated major bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      site-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - vinext
          - vite
          - '@vitejs/*'
          - '@cloudflare/*'
          - wrangler
          - '@openai/sites-vite-plugin'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
