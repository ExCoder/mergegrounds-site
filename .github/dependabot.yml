version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - vinext
          - vite
          - '@vitejs/*'
          - '@cloudflare/*'
          - wrangler
          - '@openai/sites-vite-plugin'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
